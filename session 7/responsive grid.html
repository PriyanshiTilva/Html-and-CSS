<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Product Grid</title>

<style>
    body{
        font-family: Arial, sans-serif;
        margin: 20px;
        background-color: #f1f3f6;
    }

    .product-grid{
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
    }

    .product-card{
        background: white;
        border-radius: 8px;
        padding: 15px;
        text-align: center;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .product-card img{
        width: 100%;
        height: 180px;
        object-fit: cover;
        border-radius: 5px;
    }

    .product-card h3{
        margin: 10px 0;
    }

    .price{
        color: green;
        font-weight: bold;
    }

    /* Tablet View */
    @media (max-width: 768px){
        .product-grid{
            grid-template-columns: repeat(2, 1fr);
        }
    }

    /* Mobile View */
    @media (max-width: 480px){
        .product-grid{
            grid-template-columns: 1fr;
        }
    }
</style>
</head>
