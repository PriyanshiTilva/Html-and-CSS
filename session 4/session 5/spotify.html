<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Style all playlist items */
.playlist-item {
    background-color: #121212; /* Dark background */
    color: white;              /* White text */
    padding: 10px;
    margin: 5px 0;
}

/* Highlight the currently playing song */
#current-song {
    background-color: #1DB954; /* Spotify green */
    color: black;
    font-weight: bold;
}
    </style>
</head>
<body>
    <div class="playlist-item">Song 1</div>
<div class="playlist-item" id="current-song">Song 2 (Playing)</div>
<div class="playlist-item">Song 3</div>
</body>
</html>
