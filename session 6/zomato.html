<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zomato Restaurant Card</title>

    <style>
        /* Card Styling */
        .restaurant-card {
            width: 300px;
            border: 2px solid #ddd;
            padding: 15px;
            margin: 30px auto;
            border-radius: 10px;
            font-family: Arial, sans-serif;
        }

        /* Restaurant Name */
        .restaurant-name {
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 22px;
            font-weight: bold;
        }

        /* Cuisine Type */
        .cuisine {
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 10px;
            color: gray;
        }

        /* Rating */
        .rating {
            border: 1px solid #ccc;
            padding: 10px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>
<body>

    <div class="restaurant-card">
        <div class="restaurant-name">
            The Spice House
        </div>

        <div class="cuisine">
            North Indian, Chinese
        </div>

        <div class="rating">
            ★ 4.5/5
        </div>
    </div>

</body>
</html>
