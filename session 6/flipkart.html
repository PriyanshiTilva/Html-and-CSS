    <style>
        /* Product Tile */
        .product-tile {
            width: 220px;
            border: 1px solid #ccc;
            padding: 15px;
            margin: 20px;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        /* Product Image */
        .product-image {
            display: block;
            width: 150px;
            height: 150px;
            margin: 0 auto 10px;
        }

        /* Product Name */
        .product-name {
            display: block;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        /* Product Price */
        .price {
            display: inline-block;
            background-color: #f1f1f1;
            padding: 5px 10px;
            border-radius: 5px;
            color: green;
            font-weight: bold;
        }

        /* Hide Price */
        .hide-price {
            display: none;
        }
    </style>
