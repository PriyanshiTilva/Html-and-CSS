<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Refactored Movie Poster Grid</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
    }

    /* Reusable utility class */
    .spacing {
        margin: 10px;
        padding: 10px;
    }

    h2 {
        text-align: center;
    }

    .movie-grid {
        display: flex;
        gap: 20px;
        justify-content: center;
        flex-wrap: wrap;
    }

    .movie-card {
        position: relative;
        width: 200px;
        background: white;
        border-radius: 10px;
    }

    .movie-card img {
        width: 100%;
        border-radius: 10px;
        display: block;
    }

    .badge {
        position: absolute;
        top: 10px;
        left: 10px;
        background: red;
        color: white;
        border-radius: 5px;
        font-size: 12px;
        font-weight: bold;
    }

    .movie-title {
        text-align: center;
        font-weight: bold;
    }

    /*
      Maintainability Benefit:
      The .spacing class stores common margin and padding values.
      If spacing needs to be changed later, it can be updated in one
      place instead of modifying multiple CSS rules, reducing code
      duplication and making maintenance easier.
    */
</style>
</head>
