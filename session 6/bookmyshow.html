<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookMyShow Movie Poster Grid</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        margin: 20px;
    }

    h2 {
        text-align: center;
        margin-bottom: 20px;
    }

    /* Grid Layout */
    .movie-grid {
        display: flex;
        gap: 20px;
        justify-content: center;
        flex-wrap: wrap;
    }

    /* Movie Poster Card */
    .movie-card {
        position: relative; /* Parent for absolute badge */
        width: 200px;
    }

    .movie-card img {
        width: 100%;
        border-radius: 10px;
        display: block;
    }

    /* New Badge */
    .badge {
        position: absolute;
        top: 10px;
        left: 10px;
        background-color: red;
        color: white;
        padding: 5px 10px;
        font-size: 12px;
        font-weight: bold;
        border-radius: 5px;
    }

    .movie-title {
        text-align: center;
        margin-top: 8px;
        font-weight: bold;
    }
</style>
</head>
